# Cargo runs from .shells/ and also reads this file, its parent's.
#
# The SDK's vendored Rapier validates its islands in debug builds. That check fails
# after the physics crate's collision-only pass, which runs whenever a kinematic
# body moved: a contact that starts in that pass has no island link yet. The
# player's capsule is kinematic and moves every tick, so any roller that touches
# down trips it. Release builds have no such check. Turn it off for that one
# package so the tests can run; every other debug assertion stays on.
[profile.dev.package.rapier3d]
debug-assertions = false

[profile.test.package.rapier3d]
debug-assertions = false
